name: Publish to npm

on:
  push:
    tags:
      - "v?[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: yarn install --immutable
      - name: Check that the tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the package version $version"
            exit 1
          fi
      - name: Lint and test
        run: yarn lint && yarn typecheck && yarn test
      - name: Publish package on npm 📦
        run: yarn npm publish --provenance
